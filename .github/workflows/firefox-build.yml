name: Verify source and Firefox build

on:
  push:
  pull_request:

jobs:
  firefox-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: node --test tests/*.test.js
      - name: Build Firefox artifact
        run: ./build-firefox.sh
      - name: Validate Firefox manifest
        run: |
          test -f dist/firefox/manifest.json
          node -e "const m = require('./dist/firefox/manifest.json'); if (m.manifest_version !== 2 || m.name !== 'Oh My Proxy') process.exit(1)"
